name: R6.23 independent multi-floor shell preview (not approved)

on:
  push:
    branches:
      - main
    paths:
      - 'r6p23/**'
      - '.github/workflows/r6p23-preview.yml'
  pull_request:
    paths:
      - 'r6p23/**'
      - '.github/workflows/r6p23-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-r6p23-numerical-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch public repository source
        uses: actions/checkout@v6
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned independent finite-element test stack
        run: python -m pip install openseespy==3.8.0.0 'pytest>=8,<9'
      - name: Test two-floor shell, openings, diaphragm, mesh refinement and public export
        run: python -m pytest -q r6p23/test_engine.py r6p23/test_convergence.py
      - name: Validate interactive viewer JavaScript
        run: node --check r6p23/viewer.js
      - name: Run independent first-party numerical model and hash-verify artifacts
        run: |
          python -m r6p23.runner --reference --output-dir build/r6p23-reference
          python -c 'from pathlib import Path; from r6p23.runner import verify; print("R6P23_PUBLIC_REFERENCE_HASH_OK", verify(Path("build/r6p23-reference"))["source_SHA256"])'
      - name: Run and verify R6.23 interactive Pages build with R6.24 mesh screen
        run: |
          python -m r6p23.site_export --site-dir build/r6p24-preview
          python -c 'from pathlib import Path; from r6p23.site_export import verify_export; print("R6P24_PREVIEW_VERIFIED", verify_export(Path("build/r6p24-preview"))["source_SHA256"])'
          node --check build/r6p24-preview/r6p23.js
      - name: Exercise actual R6.24 desktop/mobile UI interactions and layout
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python audit/r6p24_browser_ui_smoke.py --site-dir build/r6p24-preview --out-dir build/r6p24-ui-qa
      - name: Preserve verified desktop/mobile screenshots for UI review
        uses: actions/upload-artifact@v7.0.1
        with:
          name: R6P24-desktop-mobile-browser-QA-SYNTHETIC
          path: build/r6p24-ui-qa/
          if-no-files-found: error
      - name: Archive synthetic reference only, NEVER a building design
        uses: actions/upload-artifact@v7.0.1
        with:
          name: R6P23-synthetic-multifloor-shell-NOT-ENGINEERING-APPROVED
          path: build/r6p23-reference/
          if-no-files-found: error
