name: g15-open-3d-analysis

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-source-derived-3d:
    if: github.event_name == 'workflow_dispatch' || ((github.event.issue.user.login == 'FabinGurung' || github.event.issue.user.login == 'Kaksaveksaka') && startsWith(github.event.issue.title, '[JP G15 3D]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout pinned tested open-source 3D engine and model
        uses: actions/checkout@v6
        with:
          ref: c4353c564a256c49fe0d2680f68d89814bef16a0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OpenSees runtime and test dependencies
        run: python -m pip install -e ".[test,opensees]"
      - name: Run public-source 3D frame with validated numeric inputs
        env:
          RUN_MODE: ${{ github.event_name }}
        run: |
          if [ "$RUN_MODE" = "workflow_dispatch" ]; then
            python scripts/run_g15_open_3d.py --sample --output build/g15_user_run/results.json
          else
            python scripts/run_g15_open_3d.py --event "$GITHUB_EVENT_PATH" --output build/g15_user_run/results.json
          fi
      - name: Upload full signed five-case OpenSees 3D member actions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-real-source-open-3d-signed-${{ github.run_id }}-hold
          path: build/g15_user_run/results.json
          retention-days: 30
      - name: Reply to authorized GitHub issue with completed run
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Real-source **provisional** 3D model calculated: 92 nodes, 165 working frame members, gravity and ±X/±Y signed cases. Download the OpenSees JSON artifact (all 165 member actions per case) from ${url}. The member geometry and many load assumptions are unverified and footing F3 remains NOT SAFE IN ONE WAY SHEAR. No engineering approval.`
            });
