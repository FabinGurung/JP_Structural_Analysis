name: R6.26 independent Narayani OpenSees structural report QA (engineering HOLD)

on:
  pull_request:
    paths:
      - 'r6p26/**'
      - '.github/workflows/r6p26-report-qa.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'r6p26/**'
      - '.github/workflows/r6p26-report-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-recalculate-six-chapter-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout immutable source-DXF-derived Narayani drawing registers
        uses: actions/checkout@v6
        with:
          repository: FabinGurung/jp-drawing-coordination
          ref: 259d11e1543e4ba7040373a752b823396e12d7f8
          path: drawing-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install genuine independent FE solver, regression suite and real Chromium browser
        run: |
          python -m pip install openseespy==3.8.0.0 'pytest>=8,<9' playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate source graph, OpenSees signed end forces, 6-axis balance and final report integrity
        env:
          R6P25_CAD_ROOT: drawing-source
        run: |
          python -m pytest -q r6p25/test_narayani_intake.py r6p25/test_qa_export.py r6p26/test_engine.py
          node --check r6p26/report.js
      - name: Independently regenerate original-report-shaped 6-chapter HTML and numerical CSV/JSON receipt
        run: |
          mkdir -p build/report-site
          printf '<nav><a href="r6p25.html">Narayani QA</a></nav>' > build/report-site/index.html
          printf '<nav><a href="r6p25.html">Narayani QA</a></nav>' > build/report-site/report.html
          printf '<nav><a href="r6p25.html">Narayani QA</a></nav>' > build/report-site/more.html
          printf '<nav><a href="r6p25.html">Narayani QA</a></nav>' > build/report-site/r6p23.html
          printf '<nav><a href="r6p25.html">Narayani QA</a></nav>' > build/report-site/r6p25.html
          python -m r6p26.publish --cad-root drawing-source --site-dir build/report-site
          python -c 'from pathlib import Path; from r6p26.publish import verify; print("R6P26_REPRODUCED_REPORT_SHA256_VERIFIED", verify(Path("build/report-site"))["result_sha256"])'
          node --check build/report-site/r6p26-report.js
      - name: QA real desktop/mobile reports, filters, drilldowns and no 390px horizontal overflow
        run: python r6p26/browser_smoke.py --site-dir build/report-site --screenshots build/report-ui-screens
      - name: Preserve source-safe numeric report receipts and QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: R6P26-Independent-OpenSees-Report-QA-NOT-FOR-CONSTRUCTION
          path: |
            build/report-ui-screens/
            build/report-site/reports/r6p26/narayani-verified-manifest.json
          if-no-files-found: error
