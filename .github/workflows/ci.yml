name: structural-engine-ci

on:
  push:
    branches:
      - engine/opensees-sar-v0.1
      - 'site/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install governed test stack
        run: python -m pip install -e ".[test,opensees]"
      - name: Run unit and regression tests
        run: python -m pytest -q
      - name: Run public-data safety scan
        run: python scripts/check_public_safety.py
      - name: Build sanitized SAR package
        run: python examples/sanitized/mdm_two_span/build_example.py --output build/mdm_two_span
      - name: Generate synthetic M09 evidence for public site QA
        run: python scripts/build_m09_section_case.py --output site/data/m09-section-capacity.v0.1.json
      - name: Generate signed D2 OpenSees synthetic member design evidence
        run: python scripts/build_d2_signed_frame_case.py --output site/data/d2_signed_frame.v0.1.json
      - name: Regenerate direct SP16 Chart31 sampled source evidence for website QA
        run: python scripts/build_sp16_chart31_spotcheck.py --output site/data/sp16_chart31_spotcheck.v0.1.json
      - name: Build strictly synthetic NBC105 equivalent-static numerical demo
        run: python scripts/build_nbc105_esm_synthetic.py --output site/data/nbc105_esm_synthetic.v0.1.json
      - name: Build synthetic signed Gate06 eccentricity stiffness and mass data
        run: python scripts/build_gate06_synthetic.py --output site/data/nbc105_gate06_synthetic.v0.1.json
      - name: Generate verified de-identified G+1.5 project calculation ledger
        run: python scripts/build_g15_public_ledger.py --output site/data/g15-project-ledger.v0.2.json
      - name: Validate original source-derived project projection boundaries
        run: python -m pytest -q tests/test_g15_public_ledger.py
      - name: Syntax-check interactive project journal
        run: |
          node --check site/project-ledger.js
          node --check site/private-force-viewer.js
      - name: Regenerate curated real-source Gate08 public comparison
        run: python scripts/build_g15_gate08_public.py --output site/data/g15-gate08-reconciliation.v0.1.json
      - name: Verify Gate08 source checksum, mass reconciliation and engineering HOLD
        run: python -m pytest -q tests/test_g15_public_ledger.py
      - name: Execute real synthetic OpenSees portal regression scenario
        run: python scripts/run_portal_frame.py --sample --output build/portal-mvp/open_sees_result.json
      - name: Verify browser and secure scenario runner scripts
        run: |
          node --check site/analysis-studio.js
          python -m pytest -q tests/test_portal_frame_mvp.py
      - name: Upload reproducible bounded OpenSees web-run result
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portal-synthetic-opensees-reference-not-approved
          path: build/portal-mvp/open_sees_result.json
      - name: Validate real 165-member G15 OpenSees source case
        run: python -m pytest -q tests/test_g15_open3d.py
      - name: Generate public-source OpenSees signed G15 five-case reference
        run: python scripts/run_g15_open_3d.py --sample --output build/g15_open_3d/open_source_3d_result.json
      - name: Check public 3D model editor JavaScript
        run: node --check site/g15-3d.js
      - name: Upload G15 3D open model signed calculation artifact (engineering HOLD)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-public-source-165-member-opensees-not-approved
          path: build/g15_open_3d/open_source_3d_result.json
      - name: Build signed default 165-member G15 reference for public 3D viewer
        run: python scripts/run_g15_open_3d.py --sample --output site/data/g15-open3d-reference.v1.json
      - name: Generate Gate09 source geometry and mass ledger
        run: python scripts/build_g15_gate09_source_audit.py --output site/data/g15-gate09-source-audit.v0.1.json
      - name: Validate Gate09 UI and calculations
        run: |
          node --check site/gate09.js
          python -m pytest -q tests/test_g15_gate09_source_audit.py
      - name: Validate Gate10 assumed geometry and ETABS mass-source alternatives
        run: python -m pytest -q tests/test_g15_gate10_assumptions.py
      - name: Build governed 3D trial floor outlines and mass scenarios
        run: python scripts/build_g15_gate10_assumptions.py --output site/data/g15-gate10-assumptions.v0.1.json
      - name: Check proposed assumption UI
        run: node --check site/gate10.js
      - name: Test assumed rigid diaphragm accidental torsion
        run: python -m pytest -q tests/test_g15_gate11_torsion_proxy.py
      - name: Generate source-labelled signed ±5 percent torsion sensitivity
        run: python scripts/build_g15_gate11_torsion_proxy.py --output site/data/g15-gate11-diaphragm-proxy.v0.1.json
      - name: Validate advanced torsion UI syntax
        run: node --check site/gate11.js
      - name: Execute Gate12 real-frame OpenSees flexible vs rigid MPC numerical tests
        run: python -m pytest -q tests/test_g15_gate12_diaphragm_fe.py
      - name: Build Gate12 flexible and rigid diaphragm comparison for the website
        run: python scripts/run_g15_gate12_diaphragm_fe.py --summary-only --output site/data/g15-gate12-diaphragm-fe.v0.1.json
      - name: Archive Gate12 all 18 x 165 signed 12-component member actions
        run: python scripts/run_g15_gate12_diaphragm_fe.py --output build/g15-gate12/full_signed_actions.json
      - name: Upload Gate12 source-grid member force comparison (design HOLD)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gate12-g15-real-3d-diaphragm-signed-not-approved
          path: build/g15-gate12/full_signed_actions.json
      - name: Validate Gate12 FE visualization
        run: node --check site/gate12.js
      - name: Verify Gate13 actual source-bay ShellMITC4 and assumed masonry beam line-load FE
        run: python -m pytest -q tests/test_g15_gate13_shell_wall.py
      - name: Publish Gate13 matching 27-case shell/frame/rigid numerical summary
        run: python scripts/run_g15_gate13_shell_wall.py --output site/data/g15-gate13-shell-wall.v0.1.json
      - name: Archive all signed Gate13 member actions
        run: python scripts/run_g15_gate13_shell_wall.py --full --output build/g15-gate13/full_signed_actions.json
      - name: Upload shell gravity and masonry wall source sensitivity artifact (engineering HOLD)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate13-shellmitc4-27-cases-original-f3-fail
          path: build/g15-gate13/full_signed_actions.json
      - name: Browser syntax for Gate13 physical slab and wall path comparison
        run: node --check site/gate13.js
      - name: Gate14 two-level ShellMITC4 source-bay FE and gravity equivalence
        run: python -m pytest -q tests/test_g15_gate14_multilevel_shell.py
      - name: Generate Gate14 27 matched numerical cases
        run: python scripts/run_g15_gate14_multilevel_shell.py --output site/data/g15-gate14-multilevel-shell.v0.1.json
      - name: Archive Gate14 177 signed frame actions for all 27 cases
        run: python scripts/run_g15_gate14_multilevel_shell.py --full --output build/g15-gate14/full_signed_actions.json
      - name: Upload Gate14 multilevel shell numerical artifact (source physicality HOLD)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate14-two-assumed-floors-shellmitc4-signed-not-approved
          path: build/g15-gate14/full_signed_actions.json
      - name: Browser syntax for Gate14 comparison
        run: node --check site/gate14.js
      - name: Gate15 shell refinement and hypothetical opening regression
        run: python -m pytest -q tests/test_g15_gate15_mesh_opening.py
      - name: Generate Gate15 27 actual OpenSees FEM responses
        run: python scripts/run_g15_gate15_mesh_opening.py --output site/data/g15-gate15-mesh-opening.v0.1.json
      - name: Archive full signed Gate15 frame actions
        run: python scripts/run_g15_gate15_mesh_opening.py --full --output build/g15-gate15/full_signed_actions.json
      - name: Upload Gate15 source-bounded mesh/opening study (no approval)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate15-shell-mesh-and-hypothetical-opening-not-approved
          path: build/g15-gate15/full_signed_actions.json
      - name: Gate15 frontend syntax
        run: node --check site/gate15.js
      - name: Gate16 third mesh and source register engineering tests
        run: python -m pytest -q tests/test_g15_gate16_three_mesh.py
      - name: Generate Gate16 matched 2x2, 4x4 and 8x8 OpenSees result
        run: python scripts/run_g15_gate16_three_mesh.py --output site/data/g15-gate16-source-mesh.v0.1.json
      - name: Archive all Gate16 signed frame 12-component actions (engineering HOLD)
        run: python scripts/run_g15_gate16_three_mesh.py --full --output build/g15-gate16/full_signed_actions.json
      - name: Upload Gate16 36-case 3-resolution and source-conflict artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate16-third-shell-mesh-and-source-conflicts-not-approved
          path: build/g15-gate16/full_signed_actions.json
      - name: Syntax check Gate16 public comparison
        run: node --check site/gate16.js
      - name: Regression test Gate17 source provenance and seismic-mass reconciliation
        run: python -m pytest -q tests/test_g15_gate17_source_audit.py
      - name: Publish source audited Gate17 unresolved mass ledger
        run: python scripts/build_g15_gate17_source_audit.py --output site/data/g15-gate17-source-audit.v0.1.json
      - name: Archive Gate17 source audit and check source safety
        run: |
          python scripts/build_g15_gate17_source_audit.py --output build/g15-gate17/gate17_source_audit.json
          node --check site/gate17.js
      - name: Upload Gate17 reproducible source gap (not engineering approval)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate17-source-mass-report-conflicts-not-approved
          path: build/g15-gate17/gate17_source_audit.json
      - name: Gate18 original ETABS storey mass and unsafe F3 regression
        run: python -m pytest -q tests/test_g15_gate18_mass_f3.py
      - name: Publish source-verified Gate18 storey-mass arithmetic and conditional F3 screen
        run: python scripts/build_g15_gate18_mass_f3.py --output site/data/g15-gate18-source-mass-f3.v0.1.json
      - name: Archive full Gate18 source mass and F3 preliminary numerical report
        run: python scripts/build_g15_gate18_mass_f3.py --output build/g15-gate18/source_mass_f3_evidence.json
      - name: Upload mass-source and F3 fail-closed Gate18 evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate18-original-storey-mass-unsafe-f3-no-approval
          path: build/g15-gate18/source_mass_f3_evidence.json
      - name: Validate Gate18 source mass and F3 public frontend
        run: node --check site/gate18.js
      - name: Gate19 full source identity and E2K geometry/mass-source gate tests
        run: python -m pytest -q tests/test_g15_gate19_e2k.py
      - name: Build Gate19 ORIGINAL MODEL MISSING audited readiness data
        run: python scripts/screen_g15_gate19_e2k.py --output site/data/g15-gate19-e2k-readiness.v0.1.json
      - name: Verify local browser E2K triage regressions
        run: |
          node --check site/gate19.js
          node --test tests/browser/test_gate19.cjs
      - name: Upload metadata-only original model intake (NO E2K)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate19-etabs-source-missing-and-original-f3-hold
          path: site/data/g15-gate19-e2k-readiness.v0.1.json
      - name: Gate20 source-to-model and F3 forensic regression
        run: python -m pytest -q tests/test_g15_gate20_crosswalk.py
      - name: Generate Gate20 public evidence-only source acceptance matrix
        run: python scripts/build_g15_gate20_crosswalk.py --output site/data/g15-gate20-crosswalk.v0.1.json
      - name: Archive Gate20 full source and F3 discrepancy acceptance matrix
        run: python scripts/build_g15_gate20_crosswalk.py --output build/g15-gate20/source_crosswalk.json
      - name: Upload Gate20 source acceptance proof obligations and F3 red HOLD
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate20-source-reconciliation-F3-unsafe-contract-no-approval
          path: build/g15-gate20/source_crosswalk.json
      - name: Gate20 browser source crosswalk syntax
        run: node --check site/gate20.js
      - name: Gate21 real OpenSees chaptered source-citation report tests
        run: python -m pytest -q tests/test_g15_gate21_report.py
      - name: Generate real signed 3D OpenSees report HTML Markdown CSV JSON and hash manifest
        run: python scripts/build_g15_gate21_report.py --output-dir site/reports
      - name: Upload Gate21 complete open numerical report and 825 signed action records
        uses: actions/upload-artifact@v7.0.1
        with:
          name: g15-gate21-open-opensees-sar-cited-not-approved
          path: site/reports/g15-gate21-*
      - name: Check Chapter1 independently sourced original-report ledger and open gates
        run: |
          python scripts/check_g15_chapter01_source.py
          python -m pytest -q tests/test_g15_chapter01_source.py
      - name: Verify chapter-first continuous-scroll master structural report
        run: |
          python -m pytest -q tests/test_g15_report_book.py
          node --check site/report-book.js
      - name: Verify all-in-one More guide, diagrams and teaching checks
        run: python -m pytest -q tests/test_more_learning_guide.py
      - name: Build actual OpenSees learning and workflow projections
        run: |
          python scripts/build_fem_learning_cantilever.py --output site/data/opensees-cantilever-learning.v0.1.json
          python scripts/publish_fem_learning_registry.py --output-dir site/data
          node --check site/fem-triad.js
          python -m pytest -q tests/test_fem_learning_cantilever.py tests/test_fem_learning_view.py
      - name: Verify original Chapter2 materials, steel, cover, standards and alternative weights
        run: |
          python scripts/build_g15_chapter02_source_audit.py --output site/data/g15-chapter02-source-audit.v0.1.json
          python -m pytest -q tests/test_g15_chapter02_source.py
          node --check site/chapter02-audit.js
      - name: Calculate original Chapter2 wall rate source deltas without assigning actual building loads
        run: |
          python scripts/build_g15_chapter02_load_review.py --output site/data/g15-chapter02-load-review.v0.1.json
          python -m pytest -q tests/test_g15_chapter02_load_review.py
          node --check site/chapter02-audit.js
      - name: Audit original Chapter 2.6.4 to 2.8 seismic wind soft storey and signed-case readiness
        run: |
          python scripts/build_g15_chapter02_seismic_audit.py --output site/data/g15-chapter02-seismic-audit.v0.1.json
          python -m pytest -q tests/test_g15_chapter02_seismic_audit.py
          node --check site/chapter02-seismic.js
      - name: Execute original Chapter 3 method crosswalk with real OpenSees calculation and traceable holds
        run: |
          python scripts/build_g15_chapter03_method.py --output site/data/g15-chapter03-method.v0.1.json
          python -m pytest -q tests/test_g15_chapter03_method.py
          node --check site/chapter03-method.js
      - name: Chapter 4 source-model geometry, support and actual OpenSees load graph
        run: |
          python scripts/build_g15_chapter04_model_graph.py --output site/data/g15-chapter04-model-graph.v0.1.json
          python -m pytest -q tests/test_g15_chapter04_model_graph.py
          node --check site/chapter04-model.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-chapter04-model-graph.v0.1.json").read_text())
          assert d["schema"]=="jp.structural.g15.chapter04.source_model_load_graph.v0.1"
          assert len(d["nodes"])==92 and len(d["elements"])==165
          assert len(d["trial_nodal_loads"])==345 and len(d["solved_cases"])==5
          assert d["counts"]["open_sees_signed_member_case_records"]==825
          assert all(x["moment_residual_kNm"]<0.001 for x in d["solved_cases"])
          assert d["original_ETABS_model_authenticated"] is False
          assert d["actual_selfweight_assembled"] is False
          assert d["original_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["engineering_approval"] is False
          print("CH4_TRIAL_SOURCE_MODEL_345_LOAD_RECORDS_REAL_OPENSEES_APPROVAL_HOLD")
          PY
      - name: Upload Chapter 4 source-labelled model and unassigned original loads (not approved)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chapter04-model-identity-loadgraph-165-members-F3-unsafe
          path: site/data/g15-chapter04-model-graph.v0.1.json
      - name: Chapter 5 actual OpenSees signed end action panels and original report source screens
        run: |
          python scripts/build_g15_chapter05_signed_results.py --output site/data/g15-chapter05-signed-results.v0.1.json
          python -m pytest -q tests/test_g15_chapter05_signed_results.py
          node --check site/chapter05-results.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-chapter05-signed-results.v0.1.json").read_text())
          assert d["engineering_approval"] is False
          assert d["original_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["counts"]["signed_member_case_records"]==825
          assert len(d["trial_node_displacements"])==345
          assert d["original_report_claims"]["modal_90_percent_first_table_mode"]=={"UX":5,"UY":4,"RZ":6}
          assert all(x["force_residual_kN"]<.001 for x in d["case_summaries"])
          print("CH5_825_ACTUAL_SIGNED_MEMBER_CASES_345_NODAL_RECORDS_SOURCE_HOLD")
          PY
      - name: Upload Chapter 5 source-reported vs signed OpenSees results (no physical acceptance)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chapter05-signed-member-actions-original-modal-drift-conflict-not-approved
          path: site/data/g15-chapter05-signed-results.v0.1.json
      - name: Chapter 6 source choice provenance and structural schedule arithmetic checks
        run: |
          python scripts/build_g15_chapter06_source_design.py --output site/data/g15-chapter06-source-design.v0.1.json
          python -m pytest -q tests/test_g15_chapter06_source_design.py
          node --check site/chapter06-design.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-chapter06-source-design.v0.1.json").read_text())
          assert d["source_acceptance_count"]==0 and d["open_source_acceptance_count"]==15
          assert d["section6_1_columns"]["source_grid_count"]==23
          assert len(d["section6_1_columns"]["source_schedule_rows"])==12
          assert d["original_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          assert not d["engineering_approval"] and not d["code_project_compliance_demonstrated"]
          print("CH6_SOURCE_ELEMENT_ARITHMETIC_APPROVAL_HOLD_15_SOURCE_GATES")
          PY
      - name: Upload source-reproduced Chapter 6 element audit (not approved)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chapter06-source-columns-beams-slab-footing-stair-F3-unsafe
          path: site/data/g15-chapter06-source-design.v0.1.json
      - name: Annex F3 demand sensitivity and independent source-evidence recovery gates
        run: |
          python scripts/build_g15_annex_source_recovery.py --output site/data/g15-annex-source-recovery.v0.1.json
          python -m pytest -q tests/test_g15_annex_source_recovery.py
          node --check site/annex-source-recovery.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-annex-source-recovery.v0.1.json").read_text())
          assert d["gate_count"]==15 and d["accepted_gate_count"]==0
          assert d["F3_sensitivity_count"]==12
          assert all(not x["design_pass"] for x in d["F3_sensitivity_scenarios"])
          assert d["original_F3_verdict"]=="NOT SAFE IN ONE WAY SHEAR"
          assert not d["engineering_approval"] and not d["site_soil_or_bearing_verified"]
          print("ANNEX_F3_12_SENSITIVITIES_15_GATES_OPEN_NO_STRUCTURAL_APPROVAL")
          PY
      - name: Archive original-source recovery and F3 non-design demand sensitivity
        uses: actions/upload-artifact@v7.0.1
        with:
          name: annex-15-source-evidence-gates-f3-12-demand-scenarios-not-approved
          path: site/data/g15-annex-source-recovery.v0.1.json
      - name: Build independent seven-chapter report template and 24 footing scenarios
        run: |
          python scripts/build_structural_template_engine.py --input examples/sanitized/template_engine_independent.v0.2.json --output-dir site/reports
          python scripts/build_structural_template_engine.py --input examples/sanitized/template_engine_f3_conditional.v0.2.json --output-dir build/template_source_f3 --prefix template-engine-f3-conditional
          python -m pytest -q tests/test_structural_template_engine.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/reports/template-engine-reference.json").read_text())
          f=json.loads(Path("build/template_source_f3/template-engine-f3-conditional.json").read_text())
          assert d["M12_candidate_count"]==f["M12_candidate_count"]==24
          assert d["all_18_modules_complete"] is False
          assert f["original_unsafe_flags_preserved"]==["NOT SAFE IN ONE WAY SHEAR"]
          assert not d["engineer_approved"] and not f["engineer_approved"]
          assert not d["permit_eligible"] and not f["permit_eligible"]
          assert all(not x["design_approved"] for x in f["M12_footing_candidates"])
          print("TEMPLATE_7_CHAPTERS_18_COVERAGE_24_FOOTING_CASES_F3_UNSAFE_PASS")
          PY
      - name: Archive reusable template report package with SHA256 manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: template-engine-seven-chapters-reference-not-approved
          path: |
            site/reports/template-engine-reference.json
            site/reports/template-engine-reference.html
            site/reports/template-engine-reference.md
            site/reports/template-engine-reference-footing-candidates.csv
            site/reports/template-engine-reference-manifest.json
            build/template_source_f3/
      - name: Signed FE to SAR template report, M08-M09-M10 and verified same-case force vectors
        run: |
          python scripts/build_template_signed_fe_handoff.py --output-dir site/reports
          python -m pytest -q tests/test_template_signed_fe_handoff.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("site/reports")
          d=json.loads((p/"template-signed-fe-handoff.json").read_text())
          m=json.loads((p/"template-signed-fe-handoff-manifest.json").read_text())
          assert d["case_count"]==d["combination_count"]==2
          assert d["member_count"]==4 and d["member_end_action_rows"]==32
          assert d["global_six_component_balance_max_kN_or_kNm"] < 1e-5
          assert d["implemented_in_this_FE_case"]==["M04","M08","M09","M10"]
          assert d["original_F3_verdict_changed"] is False
          assert not d["engineering_approval"] and not d["permit_eligible"]
          for k,v in m["files"].items():
              assert hashlib.sha256((p/k).read_bytes()).hexdigest()==v
          print("SAR_SIGNED_FE_32_END_RECORDS_192_SIGNED_COMPONENTS_SAME_CASE_M08_M09_M10_NO_APPROVAL")
          PY
      - name: Archive signed OpenSees-to-design report with source hash and manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sar-template-signed-fe-member-design-handoff-not-approved
          path: |
            site/reports/template-signed-fe-handoff.json
            site/reports/template-signed-fe-handoff.html
            site/reports/template-signed-fe-handoff.md
            site/reports/template-signed-fe-handoff.csv
            site/reports/template-signed-fe-handoff-manifest.json
      - name: Build R5 generic frame geometry to load mass and signed FE SAR
        run: |
          python scripts/build_r5_generic_frame_case.py --input examples/sanitized/r5_generic_source_geometry_frame.v0.1.json --output-dir site/reports
