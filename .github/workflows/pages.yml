name: deploy-pages

on:
  push:
    branches:
      - engine/opensees-sar-v0.1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install governed analysis stack
        run: python -m pip install -e ".[test,opensees]"
      - name: Verify regression suite
        run: python -m pytest -q
      - name: Verify public-data boundary
        run: python scripts/check_public_safety.py
      - name: Build sanitized SAR demo into Pages site
        run: python examples/sanitized/mdm_two_span/build_example.py --output site/demo
      - name: Write deployment metadata
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("site/build-meta.json").write_text(
              json.dumps({"sha": os.environ["GITHUB_SHA_VALUE"], "deployed": "GitHub Pages"}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
