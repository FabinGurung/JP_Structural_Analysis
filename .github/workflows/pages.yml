name: Publish structural project reports

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governed engine source
        uses: actions/checkout@v6
        with:
          ref: f39c89ad55af18ea390a699af159f67f5fc8b517
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install governed analysis stack
        run: python -m pip install -e ".[test,opensees]"
      - name: Verify regression suite
        run: python -m pytest -q
      - name: Verify public-data boundary
        run: python scripts/check_public_safety.py
      - name: Build sanitized SAR demo into Pages site
        run: python examples/sanitized/mdm_two_span/build_example.py --output site/demo
      - name: Generate engine-derived synthetic M09 evidence for public site
        run: python scripts/build_m09_section_case.py --output site/data/m09-section-capacity.v0.1.json
      - name: Generate signed D2 OpenSees M08 M09 M10 synthetic evidence for site
        run: python scripts/build_d2_signed_frame_case.py --output site/data/d2_signed_frame.v0.1.json
      - name: Regenerate original SP16 Chart31 source coordinate spot checks for public site
        run: python scripts/build_sp16_chart31_spotcheck.py --output site/data/sp16_chart31_spotcheck.v0.1.json
      - name: Build source-calculated synthetic NBC105:2025 ESM for public site
        run: python scripts/build_nbc105_esm_synthetic.py --output site/data/nbc105_esm_synthetic.v0.1.json
      - name: Regenerate synthetic Gate06 eccentricity and mass comparison for public site
        run: python scripts/build_gate06_synthetic.py --output site/data/nbc105_gate06_synthetic.v0.1.json
      - name: Publish current de-identified source-linked G+1.5 calculation ledger
        run: python scripts/build_g15_public_ledger.py --output site/data/g15-project-ledger.v0.2.json
      - name: Regenerate de-identified real-source Gate08 sensitivity ledger
        run: python scripts/build_g15_gate08_public.py --output site/data/g15-gate08-reconciliation.v0.1.json
      - name: Verify bounded configurable OpenSees scenario
        run: python scripts/run_portal_frame.py --sample --output site/data/portal-reference-frame.v1.json
      - name: Build full 3D real-source signed OpenSees result for the public studio
        run: python scripts/run_g15_open_3d.py --sample --output site/data/g15-open3d-reference.v1.json
      - name: Build Gate09 source panel and seismic mass audit
        run: python scripts/build_g15_gate09_source_audit.py --output site/data/g15-gate09-source-audit.v0.1.json
      - name: Generate assumed G15 Gate10 floor/wall and ETABS mass-source variants
        run: python scripts/build_g15_gate10_assumptions.py --output site/data/g15-gate10-assumptions.v0.1.json
      - name: Generate bounded Gate11 signed accidental-torsion model
        run: python scripts/build_g15_gate11_torsion_proxy.py --output site/data/g15-gate11-diaphragm-proxy.v0.1.json
      - name: Generate Gate12 actual 3D OpenSees flexible-versus-rigid diaphragm FE comparison
        run: python scripts/run_g15_gate12_diaphragm_fe.py --summary-only --output site/data/g15-gate12-diaphragm-fe.v0.1.json
      - name: Build Gate13 3D ShellMITC4 source sample and distributed masonry wall FE comparison
        run: python scripts/run_g15_gate13_shell_wall.py --output site/data/g15-gate13-shell-wall.v0.1.json
      - name: Build Gate14 multi-level ShellMITC4 assumed bay study
        run: python scripts/run_g15_gate14_multilevel_shell.py --output site/data/g15-gate14-multilevel-shell.v0.1.json
      - name: Publish Gate15 3-mode 27-case mesh and opening OpenSees sensitivity
        run: python scripts/run_g15_gate15_mesh_opening.py --output site/data/g15-gate15-mesh-opening.v0.1.json
      - name: Generate Gate16 three-resolution FEM, drawing and mass conflict evidence
        run: python scripts/run_g15_gate16_three_mesh.py --output site/data/g15-gate16-source-mesh.v0.1.json
      - name: Publish Gate17 verified source gap and roadmap evidence
        run: python scripts/build_g15_gate17_source_audit.py --output site/data/g15-gate17-source-audit.v0.1.json
      - name: Publish original ETABS reported storey weight match and unsafe F3 screen
        run: python scripts/build_g15_gate18_mass_f3.py --output site/data/g15-gate18-source-mass-f3.v0.1.json
      - name: Publish original ETABS source intake readiness (metadata only)
        run: python scripts/screen_g15_gate19_e2k.py --output site/data/g15-gate19-e2k-readiness.v0.1.json
      - name: Verify local only E2K syntax and regression tests
        run: |
          node --check site/gate19.js
          node --test tests/browser/test_gate19.cjs
      - name: Publish Gate20 source-to-model acceptance register and unsafe F3 audit
        run: python scripts/build_g15_gate20_crosswalk.py --output site/data/g15-gate20-crosswalk.v0.1.json
      - name: Syntax check Gate20 source-proof table
        run: node --check site/gate20.js
      - name: Generate real cited OpenSees chaptered analysis report for GitHub Pages
        run: python scripts/build_g15_gate21_report.py --output-dir site/reports
      - name: Verify mandatory open signed report and source-preserving safety flags
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("site/reports")
          d=json.loads((p/"g15-gate21-report.v0.1.json").read_text())
          m=json.loads((p/"g15-gate21-manifest.json").read_text())
          assert d["case_count"]==5 and d["signed_end_action_count"]==825
          assert d["F3_verdict"]=="NOT SAFE IN ONE WAY SHEAR" and not d["engineering_approval"]
          assert not d["model_ETABS_source_verified"] and not d["p_delta_performed"]
          for f,details in m["files"].items():
              assert hashlib.sha256((p/f).read_bytes()).hexdigest()==details["sha256"]
          print("OPEN_G15_GATE21_SAR_REPRODUCIBILITY_PASS")
          PY
      - name: Confirm one continuous chaptered structural report and preserved engineering evidence
        run: |
          python -m pytest -q tests/test_g15_report_book.py
          node --check site/report-book.js
      - name: Validate original report TOC and light primary navigation
        run: |
          python -m pytest -q tests/test_g15_report_book.py
          node --check site/report-book.js
          python - <<'PY'
          from pathlib import Path
          t=Path("site/report.html").read_text()
          assert "rb-original-toc" in t and "2.0 General Data for Structural Analysis" in t
          assert t.count('class="rb-chapter"')==7
          assert 'NOT SAFE IN ONE WAY SHEAR' in t
          for target in ("index.html","report.html","more.html"):
              assert f'href="{target}"' in t
          print("SOURCE_TOC_SIX_CHAPTER_ANNEX_READBACK_PASS")
          PY
      - name: Verify More illustrated education guide and complete public workflow explanations
        run: |
          python -m pytest -q tests/test_more_learning_guide.py
          python - <<'PY'
          from pathlib import Path
          h=Path("site/more.html").read_text(encoding="utf-8")
          assert h.count('<details class="guide-check">')>=10
          assert all(f'id="guide-{x}"' in h for x in ("map","3d","run","lab","skills","machines","selftest"))
          assert "NOT SAFE IN ONE WAY SHEAR" in h
          assert "825" in h and "18" in h and "816" in h
          assert (Path("site")/"more-guide.css").is_file()
          print("MORE_GUIDE_SELF_CONTAINED_6_LESSONS_QA_PASS")
          PY
      - name: Enforce original report chapter ordering and More R&D source preservation
        run: |
          python -m pytest -q tests/test_g15_report_book.py tests/test_more_learning_guide.py
          python - <<'PY'
          from pathlib import Path
          report=Path("site/report.html").read_text()
          more=Path("site/more.html").read_text()
          mids=("gate05-report","gate06-report","m09-report-case","d2-trace","gate21-report-engine")
          for mid in mids:
              assert ('id="'+mid+'"') not in report
              assert more.count('id="'+mid+'"')==1
          assert 'id="chapter-01-input-check"' in report
          assert 'id="guide-opensees-engine"' in more
          assert "NOT SAFE IN ONE WAY SHEAR" in report and "NOT SAFE IN ONE WAY SHEAR" in more
          print("REPORT_SOURCE_SEQUENCE_AND_PRESERVATION_PASS")
          PY
      - name: Validate Chapter01 provenance and unresolved original-source engineering holds
        run: |
          python scripts/check_g15_chapter01_source.py
          python -m pytest -q tests/test_g15_chapter01_source.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("site/data/g15-chapter01-source-review.v0.1.json").read_text())
          a=x["acceptance"]
          assert a["open_obligations"]==7 and a["accepted_obligations"]==0
          assert a["engineering_approval"] is False
          assert a["source_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          print("SOURCE_VERIFIED_CHAPTER1_NARRATIVE_NOT_A_PHYSICAL_ENGINEERING_APPROVAL")
          PY
      - name: Publish real OpenSees and ETABS style learning data into Pages
        run: |
          python scripts/build_fem_learning_cantilever.py --output site/data/opensees-cantilever-learning.v0.1.json
          python scripts/publish_fem_learning_registry.py --output-dir site/data
          python -m pytest -q tests/test_fem_learning_cantilever.py tests/test_fem_learning_view.py
          node --check site/fem-triad.js
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path("site/data")
          d=json.loads((s/"opensees-cantilever-learning.v0.1.json").read_text())
          assert len(d["cases"])==4
          assert d["project_model_used"] is False and d["engineering_approval"] is False
          assert d["nepal_design_compliance"]=="NOT_EVALUATED"
          assert "id=\"guide-fem-triad\"" in Path("site/more.html").read_text()
          assert "id=\"chapter-02-input-provenance\"" in Path("site/report.html").read_text()
          print("THREE_SVG_OPEN_SEES_HAND_PROOF_AND_NBC_SCOPE_PROJECTION_PASS")
          PY
      - name: Publish source-audited Chapter 2 materials, reinforcement, cover, code and wall rates
        run: |
          python scripts/build_g15_chapter02_source_audit.py --output site/data/g15-chapter02-source-audit.v0.1.json
          python scripts/build_g15_chapter02_load_review.py --output site/data/g15-chapter02-load-review.v0.1.json
          python -m pytest -q tests/test_g15_chapter02_source.py tests/test_g15_chapter02_load_review.py
          node --check site/chapter02-audit.js
          python - <<'PY'
          from pathlib import Path
          import json,math
          root=Path("site/data")
          d=json.loads((root/"g15-chapter02-source-audit.v0.1.json").read_text())
          w=json.loads((root/"g15-chapter02-load-review.v0.1.json").read_text())
          assert d["source_record_count"]==21 and d["gate_open_count"]==8 and d["gate_accepted_count"]==0
          assert d["engineering_approval"] is False
          assert math.isclose(d["source_findings"]["independent_formula_E_MPa"],5000*math.sqrt(20),rel_tol=1e-12)
          assert d["source_findings"]["steel_modulus_admitted_for_design"] is False
          assert w["numeric_screen_discrepancies_count"]==2
          assert w["member_load_assignments_accepted"]==0
          assert w["original_F3_verdict"]=="NOT SAFE IN ONE WAY SHEAR"
          assert w["engineering_approval"] is False
          print("SOURCE_CHAPTER2_MATERIAL_AND_UNASSIGNED_LOAD_SCREEN_PASS")
          PY
      - name: Publish original Chapter 2.6.4 to 2.8 seismic source arithmetic and bounded safety checks
        run: |
          python scripts/build_g15_chapter02_seismic_audit.py --output site/data/g15-chapter02-seismic-audit.v0.1.json
          python -m pytest -q tests/test_g15_chapter02_seismic_audit.py
          node --check site/chapter02-seismic.js
          python - <<'PY'
          from pathlib import Path
          import json,math
          p=Path("site/data/g15-chapter02-seismic-audit.v0.1.json")
          d=json.loads(p.read_text())
          t=d["source_summary"]
          assert d["engineering_approval"] is False and d["physical_evidence_accepted"] is False
          assert d["source_mass_reconciled"] is False
          assert d["source_f3_verdict"]=="NOT SAFE IN ONE WAY SHEAR"
          assert t["source_ULS_coefficient_printed"]==.131
          assert t["formula_ULS_coefficient_unrounded"]==.13125
          assert d["wind_screen"]["wind_dominance_proven"] is False
          assert d["soft_storey_screen"]["actual_story_stiffnesses_verified"] is False
          assert len(d["source_conditional_floor_weights_and_forces"])==3
          print("G15_SOURCE_CHAPTER02_6_TO_8_ACCEPTANCE_GATES_PRESERVED")
          PY
      - name: Publish original Chapter 3 source-to-OpenSees method and verified signed numeric evidence
        run: |
          python scripts/build_g15_chapter03_method.py --output site/data/g15-chapter03-method.v0.1.json
          python -m pytest -q tests/test_g15_chapter03_method.py
          node --check site/chapter03-method.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-chapter03-method.v0.1.json").read_text())
          n=d["real_OpenSees_numerical_snapshot"]
          assert d["engineering_approval"] is False
          assert d["original_native_ETABS_model_authenticated"] is False
          assert d["original_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["source_gates_open"]==15 and d["accepted_engineering_method_stages"]==0
          assert len(d["stages"])==12
          assert n["members"]==165 and n["case_count"]==5
          assert n["signed_member_end_action_records"]==825
          assert n["max_equilibrium_force_residual_kN"]<0.001
          assert n["max_equilibrium_moment_residual_kNm"]<0.001
          print("CHAPTER3_METHOD_AND_SOLVER_NOT_PHYSICAL_APPROVAL_PASS")
          PY
      - name: Publish Chapter 4 normalized source-to-model OpenSees graph
        run: |
          python scripts/build_g15_chapter04_model_graph.py --output site/data/g15-chapter04-model-graph.v0.1.json
          python -m pytest -q tests/test_g15_chapter04_model_graph.py
          node --check site/chapter04-model.js
          node --check site/g15-3d.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-chapter04-model-graph.v0.1.json").read_text())
          assert d["engineering_approval"] is False
          assert d["original_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          assert (len(d["nodes"]),len(d["elements"]),len(d["trial_nodal_loads"]))==(92,165,345)
          assert all(x["moment_residual_kNm"]<0.001 for x in d["solved_cases"])
          print("CH4_SOURCE_TRIAL_MODEL_OPENSEES_PAGES_PASS_NO_DESIGN_APPROVAL")
          PY
      - name: Publish Chapter 5 source-indexed real OpenSees signed end action and trial displacements
        run: |
          python scripts/build_g15_chapter05_signed_results.py --output site/data/g15-chapter05-signed-results.v0.1.json
          python -m pytest -q tests/test_g15_chapter05_signed_results.py
          node --check site/chapter05-results.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-chapter05-signed-results.v0.1.json").read_text())
          assert d["counts"]["signed_member_case_records"]==825
          assert d["counts"]["trial_displacement_records"]==345
          assert d["original_report_claims"]["modal_90_percent_first_table_mode"]=={"UX":5,"UY":4,"RZ":6}
          assert d["original_report_claims"]["modal_period_source_conflict_s"]["resolved"] is False
          assert d["engineering_approval"] is False and d["original_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["counts"]["source_gates_open"]==15
          print("CH5_825_SIGNED_OPENSEES_RESULTS_345_NODAL_RECORDS_PAGES_APPROVAL_HOLD")
          PY
      - name: Publish Chapter 6 original-source element arithmetic and 15 protected source gates
        run: |
          python scripts/build_g15_chapter06_source_design.py --output site/data/g15-chapter06-source-design.v0.1.json
          python -m pytest -q tests/test_g15_chapter06_source_design.py
          node --check site/chapter06-design.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-chapter06-source-design.v0.1.json").read_text())
          assert d["section6_1_columns"]["source_grid_count"]==23
          assert len(d["section6_1_columns"]["source_schedule_rows"])==12
          assert d["source_acceptance_count"]==0 and d["open_source_acceptance_count"]==15
          assert d["original_F3_one_way_shear"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["engineering_approval"] is False
          assert d["section6_4_footing"]["F3_original_schedule_accepted"] is False
          print("CH6_ORIGINAL_REPORT_EVIDENCE_15_GATES_OPEN_F3_UNSAFE_PAGES_PASS")
          PY
      - name: Publish Annex source evidence recovery and original F3 geometric demand sensitivity
        run: |
          python scripts/build_g15_annex_source_recovery.py --output site/data/g15-annex-source-recovery.v0.1.json
          python -m pytest -q tests/test_g15_annex_source_recovery.py
          node --check site/annex-source-recovery.js
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data/g15-annex-source-recovery.v0.1.json").read_text())
          assert d["gate_count"]==15 and d["accepted_gate_count"]==0
          assert len(d["F3_sensitivity_scenarios"])==12
          assert all(x["design_pass"] is False for x in d["F3_sensitivity_scenarios"])
          assert d["original_F3_verdict"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["site_soil_or_bearing_verified"] is False
          assert d["engineering_approval"] is False
          print("ANNEX_F3_12_DEMAND_SENSITIVITIES_SOURCE_GATE15_HOLD_PAGES_PASS")
          PY
      - name: Publish reusable independent seven-chapter SAR template and 24 isolated-footing comparisons
        run: |
          python scripts/build_structural_template_engine.py --input examples/sanitized/template_engine_independent.v0.2.json --output-dir site/reports
          python -m pytest -q tests/test_structural_template_engine.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("site/reports")
          d=json.loads((p/"template-engine-reference.json").read_text())
          m=json.loads((p/"template-engine-reference-manifest.json").read_text())
          assert d["M12_candidate_count"]==24 and d["M12_numeric_candidate_count"]==3
          assert len(d["chapters"])==7 and len(d["modules_calculated"])==7
          assert d["all_18_modules_complete"] is False
          assert not d["engineer_approved"] and not d["permit_eligible"] and not d["engineering_approval"]
          assert all(not x["design_approved"] for x in d["M12_footing_candidates"])
          for name,digest in m["files"].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest
          print("PAGES_TEMPLATE_ENGINE_SEVEN_CHAPTERS_24_CANDIDATES_3_BOUNDED_NUMERIC_ONLY_UNAPPROVED")
          PY
      - name: Publish signed FE to original SAR template Annex H with concurrent I J member action records
        run: |
          python scripts/build_template_signed_fe_handoff.py --output-dir site/reports
          python -m pytest -q tests/test_template_signed_fe_handoff.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("site/reports")
          d=json.loads((p/"template-signed-fe-handoff.json").read_text())
          m=json.loads((p/"template-signed-fe-handoff-manifest.json").read_text())
          assert d["case_count"]==2 and d["combination_count"]==2 and d["member_count"]==4
          assert d["member_end_action_rows"]==32
          assert d["implemented_in_this_FE_case"]==["M04","M08","M09","M10"]
          assert d["global_six_component_balance_max_kN_or_kNm"] < 1e-5
          assert d["original_F3_verdict_changed"] is False
          assert d["original_F3_test_not_included"] is True
          assert not d["engineer_approved"] and not d["permit_eligible"]
          for name,sha in m["files"].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==sha
          print("PAGES_SIGNED_STATIC_FE_MEMBER_END_32_INTEGRATION_SAFE_HOLD")
          PY
      - name: Publish R5 generalized frame load and seismic mass to signed OpenSees SAR
        run: |
          python scripts/build_r5_generic_frame_case.py --input examples/sanitized/r5_generic_source_geometry_frame.v0.1.json --output-dir site/reports
          python -m pytest -q tests/test_r5_geometry_load_source_signed.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("site/reports")
          d=json.loads((p/"r5-generic-frame-reference.json").read_text())
          m=json.loads((p/"r5-generic-frame-reference-manifest.json").read_text())
          assert d["source_load_component_count"]==3
          assert abs(d["source_total_gravity_kN"]-128)<1e-9
          assert abs(d["source_total_seismic_weight_kN"]-111.2)<1e-9
          assert d["frame_member_count"]==8 and d["signed_end_action_count"]==80
          assert d["raw_case_count"]==3 and d["signed_combination_count"]==2
          assert d["max_six_component_FE_balance_kN_or_kNm"]<1e-5
          assert d["true_distributed_member_end_forces_or_member_diagrams_evaluated"] is False
          assert d["original_G15_F3_one_way_shear_flag"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["engineering_approval"] is False and d["permit_eligible"] is False
          for k,v in m["files"].items():
              assert hashlib.sha256((p/k).read_bytes()).hexdigest()==v
          print("PAGES_R5_GEOMETRIC_PANEL_LINE_LOAD_128_KN_MASS_111P2_SIGNED_FE_80_UNAPPROVED")
          PY
      - name: Publish native 3D uniform beam element loads and independent fixed-end benchmark
        run: |
          python scripts/build_r5_uniform_beam_case.py --input examples/sanitized/r5_generic_source_geometry_frame.v0.1.json --output-dir site/reports
          python -m pytest -q tests/test_r5_uniform_distributed_beam.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("site/reports")
          d=json.loads((p/"r5-distributed-beam-reference.json").read_text())
          m=json.loads((p/"r5-distributed-beam-reference-manifest.json").read_text())
          assert d["source_total_gravity_kN"]==128
          assert d["true_element_uniform_resultants_kN"]==32
          assert d["nodal_resultants_kN"]==96
          assert d["signed_end_action_count"]==80
          assert d["global_six_component_equilibrium_max_kN_or_kNm"]<1e-5
          assert any(abs(x["moment_difference_kNm"])>1e-4 for x in d["predecessor_equivalent_nodal_comparison"])
          assert d["original_F3_failure"]=="NOT SAFE IN ONE WAY SHEAR"
          assert d["panel_pressure_is_still_nodal_equivalent"] is True
          assert not d["engineering_approval"] and not d["permit_eligible"]
          for name,checksum in m["files"].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==checksum
          print("PAGES_R5_NATIVE_BEAM_UNIFORM_32KN_F3_UNSAFE_80_SIGNED_ACTIONS_NOT_APPROVED")
          PY
      - name: Publish source-signed in-span beam Vz My diagrams and CSV
        run: |
          python scripts/build_r5_beam_span_diagrams.py --input examples/sanitized/r5_generic_source_geometry_frame.v0.1.json --output-dir site/reports
          python -m pytest -q tests/test_r5_beam_span_diagrams.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("site/reports")
