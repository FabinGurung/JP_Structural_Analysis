[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-structural-analysis"
version = "0.1.0.dev0"
description = "Governed structural-analysis and SAR engine"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
opensees = ["openseespy==3.8.0.0"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
